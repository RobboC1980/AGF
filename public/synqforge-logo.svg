      <stop offset="50%" style="stop-color:#0097a7;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2c3e50;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Logo Icon -->
