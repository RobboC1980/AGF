global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - "alert_rules.yml"

alerting:
  alertmanagers:
    - static_configs:
        - targets:
          - alertmanager:9093

scrape_configs:
  # Prometheus self-monitoring
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # FastAPI application metrics
  - job_name: 'agileforge-api'
    static_configs:
      - targets: ['api-core:8000']
    scrape_interval: 5s
    metrics_path: '/metrics'

  # Analytics service metrics
  - job_name: 'agileforge-analytics'
    static_configs:
      - targets: ['analytics-service:8001']
    scrape_interval: 10s
    metrics_path: '/metrics'

  # Redis metrics
  - job_name: 'redis'
    static_configs:
      - targets: ['redis:6379']

  # PostgreSQL metrics (if using postgres_exporter)
  - job_name: 'postgres'
    static_configs:
      - targets: ['postgres-exporter:9187']

  # Celery metrics (Flower)
  - job_name: 'celery'
    static_configs:
      - targets: ['flower:5555']
    scrape_interval: 10s

  # Node exporter for system metrics
  - job_name: 'node'
    static_configs:
      - targets: ['node-exporter:9100']

  # Health check endpoints
  - job_name: 'health-checks'
    static_configs:
      - targets: ['backend:8000']
    metrics_path: '/health'
    scrape_interval: 10s
    scrape_timeout: 5s 